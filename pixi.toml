[workspace]
authors = ["DanielChahine004 <daniel.chahine004@gmail.com>"]
channels = ["conda-forge"]
name = "local_latex"
platforms = ["win-64"]
version = "0.1.0"

[tasks]
# biber (not on conda-forge for Windows) lives in tools/biber; tectonic
# invokes it automatically for biblatex documents if it's on PATH
[tasks.build]
# -k keeps the TikZ externalisation stamps (*.md5); shell-escape-cwd lands the
# figure sub-compiles (tools/tikz-external.bat) in the same outdir
cmd = "mkdir -p build/thesis && tectonic --synctex -k -Z shell-escape-cwd=build/thesis --outdir build/thesis src/thesis/main.tex"
env = { PATH = "$PIXI_PROJECT_ROOT/tools;$PIXI_PROJECT_ROOT/tools/biber;$PATH" }

[tasks.build-meetings]
cmd = "mkdir -p build/meetings && tectonic --synctex --outdir build/meetings src/meetings/main.tex"
env = { PATH = "$PIXI_PROJECT_ROOT/tools/biber;$PATH" }

# search-path lets it read the thesis's units.tex and references.bib in place,
# so there are no copies to keep in sync
[tasks.build-notes]
cmd = "mkdir -p build/paper-notes && tectonic --synctex -Z search-path=src/thesis --outdir build/paper-notes src/paper-notes/main.tex"
env = { PATH = "$PIXI_PROJECT_ROOT/tools/biber;$PATH" }

# paper-notes as a zoomable mind map in the browser (tools/notes_canvas.py);
# uv resolves danvas from the script's inline metadata, nothing to install
[tasks.notes-canvas]
cmd = "uv run --python 3.12 tools/notes_canvas.py"

# the same board pinned to a world map by institution (tools/assets/world-blue-marble.jpg, NASA, public domain)
[tasks.notes-map]
cmd = "uv run --python 3.12 tools/notes_canvas.py --map"

# commit local work, pull --rebase the other machine's commits, push
[tasks.sync]
cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File tools/sync.ps1"

[dependencies]
tectonic = ">=0.16.9,<0.17"
