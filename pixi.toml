[workspace]
authors = ["DanielChahine004 <daniel.chahine004@gmail.com>"]
channels = ["conda-forge"]
name = "local_latex"
platforms = ["win-64", "linux-64"]
version = "0.1.0"

# Build tasks differ per OS: PATH separator, and the biber / tikz-external /
# sync helpers in tools/ (.exe/.bat/.ps1 on Windows, .sh/no extension on Linux).

# --- Windows ---
# biber (not on conda-forge for Windows) lives in tools/biber; tectonic
# invokes it automatically for biblatex documents if it's on PATH
[target.win-64.tasks.build]
# -k keeps the TikZ externalisation stamps (*.md5); shell-escape-cwd lands the
# figure sub-compiles (tools/tikz-external.bat) in the same outdir
cmd = "mkdir -p build/thesis && tectonic --synctex -k -Z shell-escape-cwd=build/thesis --outdir build/thesis src/thesis/main.tex"
env = { PATH = "$PIXI_PROJECT_ROOT/tools;$PIXI_PROJECT_ROOT/tools/biber;$PATH" }

[target.win-64.tasks.build-meetings]
cmd = "mkdir -p build/meetings && tectonic --synctex --outdir build/meetings src/meetings/main.tex"
env = { PATH = "$PIXI_PROJECT_ROOT/tools/biber;$PATH" }

# search-path lets it read the thesis's units.tex and references.bib in place,
# so there are no copies to keep in sync
[target.win-64.tasks.build-notes]
cmd = "mkdir -p build/paper-notes && tectonic --synctex -Z search-path=src/thesis --outdir build/paper-notes src/paper-notes/main.tex"
env = { PATH = "$PIXI_PROJECT_ROOT/tools/biber;$PATH" }

# commit local work, pull --rebase the other machine's commits, push
[target.win-64.tasks.sync]
cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File tools/sync.ps1"

# LaTeX Workshop (Ctrl+Alt+B) runs `pixi run vscode-build <tectonic args>` on
# both OSes; this picks the wrapper
[target.win-64.tasks.vscode-build]
cmd = "cmd /c $PIXI_PROJECT_ROOT/tools/vscode-tectonic.bat"

# --- Linux ---
# tools/get-biber.sh fetches biber 2.17 into tools/biber (gitignored) on first
# use; tools/tikz-external is the twin of tikz-external.bat
[target.linux-64.tasks.get-biber]
cmd = "bash tools/get-biber.sh"

[target.linux-64.tasks.build]
cmd = "mkdir -p build/thesis && tectonic --synctex -k -Z shell-escape-cwd=build/thesis --outdir build/thesis src/thesis/main.tex"
env = { PATH = "$PIXI_PROJECT_ROOT/tools:$PIXI_PROJECT_ROOT/tools/biber:$PATH" }
depends-on = ["get-biber"]

[target.linux-64.tasks.build-meetings]
cmd = "mkdir -p build/meetings && tectonic --synctex --outdir build/meetings src/meetings/main.tex"
env = { PATH = "$PIXI_PROJECT_ROOT/tools/biber:$PATH" }
depends-on = ["get-biber"]

[target.linux-64.tasks.build-notes]
cmd = "mkdir -p build/paper-notes && tectonic --synctex -Z search-path=src/thesis --outdir build/paper-notes src/paper-notes/main.tex"
env = { PATH = "$PIXI_PROJECT_ROOT/tools/biber:$PATH" }
depends-on = ["get-biber"]

[target.linux-64.tasks.vscode-build]
cmd = "bash tools/vscode-tectonic.sh"

[target.linux-64.tasks.sync]
cmd = "bash tools/sync.sh"

# --- both ---
# the paper notes as a live board or world map (tools/notesmap, configured by
# notesmap.toml); uv, a dependency below, builds the tool's environment from
# its pyproject on first run. The board follows edits to the notes in place.
[tasks.notes-map]
cmd = "uv run --quiet --python 3.12 --project tools/notesmap notesmap serve --map"

[tasks.notes-canvas]
cmd = "uv run --quiet --python 3.12 --project tools/notesmap notesmap serve"

# lint the notes: missing images, dangling \refs, programmes without \location
[tasks.notes-check]
cmd = "uv run --quiet --python 3.12 --project tools/notesmap notesmap check"

# the notes as a live shared editor: JupyterLab with real-time collaboration, so
# several people type in one file at once and the map follows. It serves only
# src/paper-notes, and the frame-ancestors header lets the map embed it.
# NOTES_EDIT_TOKEN is the password (default: change-me). A pixi task env would
# override one set in the shell, so it is left to the config file's default.
[tasks.notes-edit]
cmd = "uv run --quiet --python 3.12 --with jupyterlab --with jupyter-collaboration --no-project jupyter lab --config=tools/jupyter-notes-config.py"


# the whole shared setup in one command: map, editor, and a public link for each
# through danvas's tunnel keepers, which hold their addresses across restarts
[tasks.notes-lab]
cmd = "uv run --quiet --python 3.12 --project tools/notesmap --with pycloudflared python tools/notes-lab.py"


[dependencies]
tectonic = ">=0.16.9,<0.17"
uv = ">=0.12.13,<0.13"
