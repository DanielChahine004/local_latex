[project]
name = "notesmap"
version = "0.1.0"
description = "Render LaTeX research-programme notes as a live, zoomable board or world map"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["danvas>=0.8,<0.9", "pillow"]

[project.scripts]
notesmap = "notesmap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notesmap"]
