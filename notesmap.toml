# notesmap configuration for this repo's paper notes (tools/notesmap).
# pixi run notes-map / notes-canvas / notes-check

[source]
path = "src/paper-notes/main.tex"
poll = 2.0
lock_files = [".lock"]

[latex]
overview_sections = ["what it is", "summary"]
# the thesis's own unit shorthands (src/thesis/units.tex) are built in:
# \mm \cm \um \ps \ns \keV \MeV and \qty / \qtyrange / \qtyproduct

[check]
# the thesis's bibliography: every \doi{} in the notes should reach an entry
# here, so a paper is not noted under one DOI and cited under another
bib = "src/thesis/references.bib"

[board]
rows = [
	["Ideas", "i3M", "AnnPET", "HUST", "Delft", "machinery"],    # the annulus cluster and what it cites
	["cMiCE", "Ghent", "WTPET", "Molecubes", "Ljubljana", "UTOFPET", "Aachen", "J-PET", "SIAT"],   # neural localisation and its precursors, plus the semi-monolithic branch
	["Davis", "LBNL", "Seoul", "CrystalClear", "AXPET", "PrismPET", "QST"],        # light transport, light sharing and layered DOI
	["MODE", "OpenGATE", "UTS", "Penn", "Geneva"],                # tooling stubs and history
	["NSSMIC2026", "NSSMIC2027"],                       # conferences, with their countdowns
]
# cross-references that are a shared citation, not a relationship
prune = [["i3M", "machinery"], ["Delft", "machinery"]]
# programmes whose arrows appear only from the card that is unfolded: the ideas
# panel refers to most of the map, and drawn at once its arrows bury it
open_arrows = ["Ideas"]
# programmes whose own note starts unfolded, so their content shows without a click
open_default = ["Leaderboard"]
loose_key = "machinery"
loose_title = "Machinery (no programme)"

[pdfs]
# a paper card links to its PDF when papers/<Key>.pdf exists. papers/ is a clone
# of the private thesis-papers repo (pixi run papers-pull), and the link opens
# GitHub's viewer: readable by the repo's collaborators, a 404 for anyone else,
# so the public board publishes no paper
dir = "papers"
url = "https://github.com/DanielChahine004/thesis-papers/blob/main/{key}.pdf"

[publish]
# the board is public and states what the papers and programmes say; these are
# this thesis's own working, kept in the PDF and left off the board, along with
# \aside{...} sentences and \gap{...} markers
hide_sections = [
	"why it matters",            # also "why it matters here"
	"capsule",
	"relevance to this thesis",
	"where it might go",
	"thesis entry",
	"scope boundary",
	"intellectual property",
	"why it stays in the file",
	"why separate from",
	"why it needs to exist",
	"the claim to be substantiated",
	"why the third point",
	"the number to take",
	"reading order",
	"to read",
	"to record",
	"arithmetic to check",
]
hide_gaps = true
# the loose papers: methods reading with no programme, shelved in the Southern
# Ocean as one panel
show_loose = true
# tooling the thesis leans on, not monolithic PET programmes
hide_programmes = ["MODE", "OpenGATE"]

[map]
width = 9000
unplaced = [400, 3250]    # the machinery panel: no institution, so the Southern Ocean
                          # (clear of danvas's own buttons at the viewport's lower left)
# panels at a fixed spot off the map, as [x, y] or [x, y, width]; no pin.
# The leaderboard sits to the right of the map (which is width wide).
fixed = { Leaderboard = [9150, 0, 1500] }

[server]
port = 8000
# the companion editor (pixi run notes-edit); a link to it sits on the map.
# comment this out and the map shows no link at all.
edit_url = "http://127.0.0.1:8891/lab"
edit_label = "Edit these notes"

# A programme's tabulars as one sortable, filterable table panel on the board.
# "at" is [x, y, width, height]; a cell such as "1.4 p" sorts as 1.4 and files
# "pitch" under "<column> basis". derive adds category columns: the first rule
# whose keyword is in the "from" column wins; a rule with no keywords is the default.
[tables.Leaderboard]
at = [10710, 0, 2700, 1350]
plain = "FWHM"
flags = { p = "pitch", L = "layer width", b = "bin width", f = "flood fit", e = "Gaussian eq.", r = "vs reference", i = "sim input" }
derive.Type = { from = "Detector", rules = [["semi-monolithic", "semi-monolith", "slabs"], ["layered", "layers"], ["monolithic", "monolith"], ["pixelated"]] }
derive.Crystal = { from = "Detector", rules = [["LYSO", "LYSO"], ["BGO", "BGO"], ["GAGG", "GAGG"], ["LSO", "LSO"], ["other"]] }
