[workspace]
authors = ["DanielChahine004 <daniel.chahine004@gmail.com>"]
channels = ["conda-forge"]
name = "local_latex"
platforms = ["win-64"]
version = "0.1.0"

[tasks]
# biber (not on conda-forge for Windows) lives in tools/biber; tectonic
# invokes it automatically for biblatex documents if it's on PATH
[tasks.build]
cmd = "python tools/count_sentences.py && mkdir -p build/thesis && tectonic --synctex --outdir build/thesis src/thesis/main.tex"
env = { PATH = "$PIXI_PROJECT_ROOT/tools/biber;$PATH" }

[tasks.build-meetings]
cmd = "mkdir -p build/meetings && tectonic --synctex --outdir build/meetings src/meetings/main.tex"
env = { PATH = "$PIXI_PROJECT_ROOT/tools/biber;$PATH" }

# units/theme/references are canonical in src/thesis; copied here so the
# paper-notes folder stays self-contained for its own Overleaf project
[tasks.build-notes]
cmd = "cp src/thesis/units.tex src/thesis/theme.tex src/thesis/references.bib src/paper-notes/ && mkdir -p build/paper-notes && tectonic --synctex --outdir build/paper-notes src/paper-notes/main.tex"
env = { PATH = "$PIXI_PROJECT_ROOT/tools/biber;$PATH" }

# commit local work, pull --rebase the other machine's commits, push
[tasks.sync]
cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File tools/sync.ps1"

# commit + push source, then force-push the fresh PDFs to the `pdf` branch
[tasks.publish]
cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File tools/publish_pdf.ps1"
depends-on = ["build", "build-meetings"]
[dependencies]
tectonic = ">=0.16.9,<0.17"
